<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>couponly</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="tag">🎟️</span> couponly</div>
      <div id="who" class="who"></div>
    </header>

    <main class="wrap">
      <section id="login-card" class="card login">
        <h1>sign in to your wallet</h1>
        <p class="muted">Your store coupons, all in one place.</p>
        <form id="login-form">
          <label>username <input name="username" value="alice" autocomplete="username" /></label>
          <label
            >password
            <input
              name="password"
              type="password"
              value="password123"
              autocomplete="current-password"
          /></label>
          <button type="submit">open wallet</button>
          <p id="login-error" class="error"></p>
        </form>
      </section>

      <section id="wallet" class="hidden">
        <div class="card">
          <h2>your coupons</h2>
          <p class="muted">Tap a coupon to open it. Each has a shareable code.</p>
          <div id="my-coupons" class="tickets"></div>
        </div>

        <div class="card">
          <h2>open a coupon by code</h2>
          <p class="muted">Paste a coupon code to view it.</p>
          <form id="open-form" class="inline">
            <input name="code" placeholder="e.g. gY6z4R" autocomplete="off" />
            <button type="submit">open</button>
          </form>
          <div id="viewer"></div>
        </div>

        <button id="logout" class="link">sign out</button>
      </section>
    </main>

    <footer class="foot">couponly · educational appsec lab · run locally only</footer>

    <script src="/app.js"></script>
  </body>
</html>
